name: Close stale issues

'on':
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: stale
          stale-issue-message: >
            This issue has been marked stale because it has had no recent
            activity. It will be closed if there is no further activity.
          close-issue-message: >
            Closing this issue due to inactivity. Please reopen or comment if
            this is still relevant.
          exempt-issue-labels: keep-open,pinned,accepted
          days-before-pr-stale: -1
          days-before-pr-close: -1
