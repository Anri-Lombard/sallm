dataset_preparation:
  paths:
    source_directory: "data/filtered_data"
    output_directory: "data/sallm_dataset_deduplicated"

  splits:
    validation_size: 0.1
    test_size: 0.1

    capping:
      max_tokens: 2000000
      chars_per_token_estimate: 4

  settings:
    seed: 42
    deduplicate: true
    expected_split_sizes:
      train: 3744654
      validation: 19940
      test: 19784
    # This order defines which copy survives and is part of the seeded split.
    expected_source_files:
