mode: TRAIN

wandb:
  project: "sallm-gated-deltanet"
  name: "125m-final"

model:
  architecture: "gated_deltanet"
  config:
    vocab_size: 65536
    hidden_size: 512
    intermediate_size: 1536
    moe_intermediate_size: 128
    shared_expert_intermediate_size: 128
    num_experts_per_tok: 1
    num_experts: 1
    num_hidden_layers: 36
    num_attention_heads: 8
    num_key_value_heads: 1
    head_dim: 64
    linear_key_head_dim: 64
    linear_value_head_dim: 64
    linear_num_key_heads: 8
    linear_num_value_heads: 8
    linear_conv_kernel_dim: 4
    max_position_embeddings: 2048
    layer_types:
      - "linear_attention"
      - "linear_attention"
      - "linear_attention"
      - "full_attention"
      - "linear_attention"
      - "linear_attention"
      - "linear_attention"
      - "full_attention"
      - "linear_attention"
      - "linear_attention"
      - "linear_attention"
      - "full_attention"
      - "linear_attention"
      - "linear_attention"
      - "linear_attention"
      - "full_attention"
      - "linear_attention"
      - "linear_attention"
      - "linear_attention"
      - "full_attention"
      - "linear_attention"
      - "linear_attention"
      - "linear_attention"
      - "full_attention"
      - "linear_attention"
      - "linear_attention"
      - "linear_attention"
      - "full_attention"
      - "linear_attention"
      - "linear_attention"
      - "linear_attention"
      - "full_attention"
      - "linear_attention"
      - "linear_attention"
      - "linear_attention"
      - "full_attention"
    tie_word_embeddings: true
    use_cache: false
  param_validation:
    min_params_m: 120.0
    max_params_m: 130.0

data:
  hf_name: "anrilombard/mzansi-text-tokenized"
  train_split: "train"
  eval_split: "validation"
  test_split: "test"

tokenizer:
  path: "${oc.env:HOME}/masters/sallm/tokenizer/sallm_bpe_tokenizer"

training:
  output_dir: "${oc.env:SCRATCH}/masters/sallm/checkpoints/sallm-gated-deltanet-125m"
  logging_dir: "${oc.env:SCRATCH}/masters/sallm/logs/sallm-gated-deltanet-125m"

  learning_rate: 4.0e-4
  max_seq_length: 2048
  lr_scheduler_type: "cosine"
  warmup_steps: 2000
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.95
  max_grad_norm: 1.0

  per_device_train_batch_size: 12
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4

  num_train_epochs: 5
  eval_strategy: "steps"
  eval_steps: 200
  save_strategy: "epoch"
  save_total_limit: 1

  bf16: true
  bf16_full_eval: true
  logging_steps: 10
  report_to: "wandb"
  prediction_loss_only: true
  ddp_find_unused_parameters: false
  torch_compile: true
  dataloader_num_workers: 8
  save_safetensors: false
