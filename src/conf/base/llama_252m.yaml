mode: TRAIN

wandb:
  project: "sallm-llama"
  name: "252m"

model:
  architecture: "llama"
  attn_implementation: "flash_attention_2"
  config:
    hidden_size: 768
    intermediate_size: 2048
    num_hidden_layers: 32
    num_attention_heads: 12
    num_key_value_heads: 4
    rms_norm_eps: 1.0e-5
    rope_theta: 10000.0
    tie_word_embeddings: true
  param_validation:
    min_params_m: 248.0
    max_params_m: 255.0

data:
  hf_name: "anrilombard/mzansi-text-tokenized"
  streaming: true
  train_split: "train"
  eval_split: "validation"
  test_split: "test"

tokenizer:
  path: "${oc.env:HOME}/masters/sallm/tokenizer/sallm_bpe_tokenizer"

training:
  output_dir: "${oc.env:SCRATCH}/masters/sallm/checkpoints/sallm-llama-252m"
  logging_dir: "${oc.env:SCRATCH}/masters/sallm/logs/sallm-llama-252m"
  max_seq_length: 2048
  learning_rate: 3.5e-4
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  num_train_epochs: 1
  max_steps: 48403
  per_device_train_batch_size: 12
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 1
  warmup_steps: 2000
  max_grad_norm: 1.0
  lr_scheduler_type: "cosine"
  bf16: true
  bf16_full_eval: true
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 500
  eval_accumulation_steps: 8
  save_strategy: "steps"
  save_steps: 2500
  save_total_limit: 1
  report_to: "wandb"
  resume_from_checkpoint: null
  ddp_find_unused_parameters: false
  accelerator_config:
    dispatch_batches: false
  prediction_loss_only: true
  torch_compile: false
  dataloader_num_workers: 8

hub:
  enabled: false
  organization: "anrilombard"
  private: true
