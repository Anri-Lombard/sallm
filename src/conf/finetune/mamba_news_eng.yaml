defaults:
  - defaults/datasets/masakhanews@_here_
  - defaults/common@_here_
  - defaults/arch/mamba2@_here_
  - _self_
wandb:
  name: mamba-125m-news-eng
peft:
  kwargs:
    lora_dropout: 0.05
dataset:
  subset: eng
  max_seq_length: 1024
training:
  output_dir: ${oc.env:SCRATCH}/masters/sallm/checkpoints/ft_mamba_125m_news_eng
  logging_dir: ${oc.env:SCRATCH}/masters/sallm/logs/ft_mamba_125m_news_eng
  run_name: mamba-125m-news-lora-finetune-eng
  per_device_train_batch_size: 4
  gradient_checkpointing: true
  metric_for_best_model: eval_classification/all_f1
  greater_is_better: true
