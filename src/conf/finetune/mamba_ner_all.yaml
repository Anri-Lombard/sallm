defaults:
  - defaults/datasets/masakhaner@_here_
  - defaults/common@_here_
  - defaults/arch/mamba2@_here_
  - _self_
wandb:
  name: mamba-125m-ner-all
dataset:
  subset: null
  max_seq_length: 2048
  languages:
    - tsn
    - xho
    - zul
training:
  output_dir: ${oc.env:SCRATCH}/masters/sallm/checkpoints/ft_mamba_125m_ner_all
  logging_dir: ${oc.env:SCRATCH}/masters/sallm/logs/ft_mamba_125m_ner_all
  run_name: mamba-125m-ner-lora-finetune-all
  gradient_accumulation_steps: 2
  per_device_train_batch_size: 32
  num_train_epochs: 10
  gradient_checkpointing: false
  metric_for_best_model: eval_all_f1
  greater_is_better: true
