defaults:
  - defaults/datasets/afrihg@_here_
  - defaults/common@_here_
  - defaults/arch/xlstm@_here_
  - _self_
wandb:
  name: xlstm-125m-afrihg-zul
dataset:
  subset: zul
  max_seq_length: 1024
training:
  output_dir: ${oc.env:SCRATCH}/masters/sallm/checkpoints/ft_xlstm_125m_afrihg_zul
  logging_dir: ${oc.env:SCRATCH}/masters/sallm/logs/ft_xlstm_125m_afrihg_zul
  run_name: xlstm-125m-afrihg-zul
  gradient_accumulation_steps: 2
  num_train_epochs: 5
  metric_for_best_model: eval_all_chrf
  greater_is_better: true
  logging_first_step: true
