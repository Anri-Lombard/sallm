defaults:
  - defaults/datasets/sa_general@_here_
  - defaults/common@_here_
  - defaults/arch/llama@_here_
  - _self_
wandb:
  name: llama-125m-sa-general-all_v2
peft:
  kwargs:
    lora_dropout: 0.0
dataset:
  subset: null
  max_seq_length: 2048
  languages: null
  mix_epoch_size: sum
  mix_max_prob: 0.6
  mix_min_prob: 0.02
  mix_temperature: 0.3
  mix_weights:
    afrihg: 0.6
    ner: 2.0
    news: 3.0
    pos: 4.0
    sib: 3.0
    t2x: 0.8
training:
  output_dir: ${oc.env:SCRATCH}/masters/sallm/checkpoints/ft_llama_125m_sa_general_all_v2
  logging_dir: ${oc.env:SCRATCH}/masters/sallm/logs/ft_llama_125m_sa_general_all_v2
  run_name: llama-125m-sa-general-all_v2
  learning_rate: 1.5685964815188856e-05
  weight_decay: 0.12048819100816038
  lr_scheduler_type: linear
  warmup_ratio: 0.0
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 2
  num_train_epochs: 10
  gradient_checkpointing: false
