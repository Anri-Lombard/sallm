defaults:
  - defaults/common@_here_
  - defaults/arch/mamba2@_here_
  - _self_
wandb:
  name: mamba-125m-sentiment-tso
dataset:
  subset: tso
  max_seq_length: 2048
  assistant_only_loss: true
  hf_name: masakhane/afrisenti
  packing: false
  splits:
    train: train
    val: validation
  task: CLASSIFICATION
  templates:
    - id: afrisenti_sentiment_classification/v1
      weight: 1.0
    - id: afrisenti_sentiment_classification/v1
      weight: 0.0
training:
  output_dir: ${oc.env:SCRATCH}/masters/sallm/checkpoints/ft_mamba_125m_afrisenti_tso
  logging_dir: ${oc.env:SCRATCH}/masters/sallm/logs/ft_mamba_125m_afrisenti_tso
  run_name: mamba-125m-afrisenti-lora-finetune-tso
  gradient_accumulation_steps: 4
  per_device_train_batch_size: 4
  num_train_epochs: 20
  metric_for_best_model: eval_classification/all_f1
  greater_is_better: true
