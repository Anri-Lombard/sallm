defaults:
  - defaults/datasets/masakhapos@_here_
  - defaults/common@_here_
  - defaults/arch/mamba2@_here_
  - _self_
wandb:
  name: mamba-125m-pos-all
dataset:
  subset: null
  max_seq_length: 2048
  languages:
    - tsn
    - xho
    - zul
training:
  output_dir: ${oc.env:SCRATCH}/masters/sallm/checkpoints/ft_mamba_125m_pos_all
  logging_dir: ${oc.env:SCRATCH}/masters/sallm/logs/ft_mamba_125m_pos_all
  run_name: mamba-125m-pos-lora-all
  per_device_train_batch_size: 8
  gradient_checkpointing: true
  metric_for_best_model: eval_all_token_accuracy
  greater_is_better: true
