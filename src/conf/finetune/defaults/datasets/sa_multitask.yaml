dataset:
  hf_name: mix:sa_multitask
  subset: null
  languages: null
  task: INSTRUCTION
  splits:
    train: train
    val: validation
  templates: []
  template_choice: CYCLE
  max_seq_length: 2048
  packing: false
  assistant_only_loss: true
  # Multitask mixture: examples-proportional with a 3,000-example cap per task (FLAN, Wei et al., 2022)
  mix_cap: 3000
  mix_epoch_size: sum
  mix_weights: {afrihg: 1.0, intent: 1.0, ner: 1.0, news: 1.0, pos: 1.0, sib: 1.0, t2x: 1.0}
training:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  per_device_eval_batch_size: 4
  num_train_epochs: 10
  task_metrics: false
  general_selection: true
  metric_for_best_model: eval_loss
  greater_is_better: false
