dataset:
  hf_name: github:dadelani/AfriHG
  task: INSTRUCTION
  splits:
    train: train
    val: validation
  templates:
    - id: afrihg_headline/v1
      weight: 1
  template_choice: CYCLE
  max_seq_length: 2048
  packing: false
  assistant_only_loss: true
training:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  per_device_eval_batch_size: 4
  metric_for_best_model: eval_all_chrf
  greater_is_better: true
generation_decoding:
  early_stopping: true
  length_penalty: 0.7
  num_beams: 5
  strategy: beam
