defaults:
  - defaults/datasets/masakhanews@_here_
  - defaults/common@_here_
  - defaults/arch/xlstm@_here_
  - _self_
wandb:
  name: xlstm-125m-news-all
peft:
  kwargs:
    r: 128
    lora_alpha: 256
    lora_dropout: 0.05
    target_modules:
      - q
      - k
      - v
      - out_proj
dataset:
  subset: null
  max_seq_length: 1024
  languages:
    - eng
    - xho
training:
  output_dir: ${oc.env:SCRATCH}/masters/sallm/checkpoints/ft_xlstm_125m_news_all
  logging_dir: ${oc.env:SCRATCH}/masters/sallm/logs/ft_xlstm_125m_news_all
  run_name: xlstm-125m-news-lora-finetune-all
  pad_to_multiple_of: 64
