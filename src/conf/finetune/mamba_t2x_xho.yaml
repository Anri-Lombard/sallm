defaults:
  - defaults/datasets/t2x@_here_
  - defaults/common@_here_
  - defaults/arch/mamba2@_here_
  - _self_
wandb:
  name: mamba-125m-t2x-xho
dataset:
  subset: xho
  max_seq_length: 2048
training:
  output_dir: ${oc.env:SCRATCH}/masters/sallm/checkpoints/ft_mamba_125m_t2x_xho
  logging_dir: ${oc.env:SCRATCH}/masters/sallm/logs/ft_mamba_125m_t2x_xho
  run_name: mamba-125m-t2x-xho
  gradient_accumulation_steps: 2
  num_train_epochs: 4
  gradient_checkpointing: true
  metric_for_best_model: eval_all_chrf
  greater_is_better: true
  label_smoothing_factor: 0.05
  logging_first_step: true
generation_decoding:
  early_stopping: true
  length_penalty: 1.0
  num_beams: 5
  strategy: beam
