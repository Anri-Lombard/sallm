defaults:
  - defaults/datasets/masakhanews@_here_
  - defaults/common@_here_
  - defaults/arch/xlstm@_here_
  - _self_
wandb:
  name: xlstm-125m-news-eng
dataset:
  subset: eng
  max_seq_length: 1024
training:
  output_dir: ${oc.env:SCRATCH}/masters/sallm/checkpoints/ft_xlstm_125m_news_eng
  run_name: xlstm-125m-news-eng
  pad_to_multiple_of: 64
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  per_device_eval_batch_size: 4
