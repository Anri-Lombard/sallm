defaults:
  - defaults/datasets/sib@_here_
  - defaults/common@_here_
  - defaults/arch/mamba2@_here_
  - _self_
wandb:
  name: mamba-125m-sib-all
peft:
  kwargs:
    lora_dropout: 0
dataset:
  subset: null
  max_seq_length: 1024
  languages:
    - afr_Latn
    - eng_Latn
    - nso_Latn
    - sot_Latn
    - xho_Latn
    - zul_Latn
training:
  output_dir: ${oc.env:SCRATCH}/masters/sallm/checkpoints/ft_mamba_125m_sib_all
  logging_dir: ${oc.env:SCRATCH}/masters/sallm/logs/ft_mamba_125m_sib_all
  run_name: mamba-125m-sib-lora-all
  gradient_accumulation_steps: 4
  num_train_epochs: 10
  gradient_checkpointing: false
  metric_for_best_model: eval_classification/all_macro_f1
  greater_is_better: true
