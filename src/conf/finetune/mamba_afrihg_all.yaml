defaults:
  - defaults/datasets/afrihg@_here_
  - defaults/common@_here_
  - defaults/arch/mamba2@_here_
  - _self_
wandb:
  name: mamba-125m-afrihg-all
dataset:
  subset: null
  max_seq_length: 1024
training:
  output_dir: ${oc.env:SCRATCH}/masters/sallm/checkpoints/ft_mamba_125m_afrihg_all
  run_name: mamba-125m-afrihg-all
  metric_for_best_model: eval_all_chrf
  greater_is_better: true
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  per_device_eval_batch_size: 4
generation_decoding:
  early_stopping: true
  length_penalty: 0.7
  num_beams: 5
  strategy: beam
