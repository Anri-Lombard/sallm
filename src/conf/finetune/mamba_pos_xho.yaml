defaults:
  - defaults/datasets/masakhapos@_here_
  - defaults/common@_here_
  - defaults/arch/mamba2@_here_
  - _self_
wandb:
  name: mamba-125m-pos-xho
dataset:
  subset: xho
  max_seq_length: 1024
training:
  output_dir: ${oc.env:SCRATCH}/masters/sallm/checkpoints/ft_mamba_125m_pos_xho
  run_name: mamba-125m-pos-xho
  metric_for_best_model: eval_all_token_accuracy
  greater_is_better: true
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  per_device_eval_batch_size: 8
