defaults:
  - defaults/datasets/masakhanews@_here_
  - defaults/common@_here_
  - defaults/arch/mamba2@_here_
  - _self_
wandb:
  name: mamba-125m-news-all
peft:
  kwargs:
    lora_dropout: 0
dataset:
  subset: null
  max_seq_length: 2048
  languages:
    - eng
    - xho
training:
  output_dir: ${oc.env:SCRATCH}/masters/sallm/checkpoints/ft_mamba_125m_news_all
  logging_dir: ${oc.env:SCRATCH}/masters/sallm/logs/ft_mamba_125m_news_all
  run_name: mamba-125m-news-lora-finetune-all
  gradient_accumulation_steps: 4
  per_device_train_batch_size: 4
  gradient_checkpointing: true
  metric_for_best_model: eval_classification/all_macro_f1
  greater_is_better: true
