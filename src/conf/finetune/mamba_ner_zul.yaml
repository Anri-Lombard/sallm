defaults:
  - defaults/datasets/masakhaner@_here_
  - defaults/common@_here_
  - defaults/arch/mamba2@_here_
  - _self_
wandb:
  name: mamba-125m-ner-zul
dataset:
  subset: null
  max_seq_length: 2048
  languages:
    - zul
training:
  output_dir: ${oc.env:SCRATCH}/masters/sallm/checkpoints/ft_mamba_125m_ner_zul
  logging_dir: ${oc.env:SCRATCH}/masters/sallm/logs/ft_mamba_125m_ner_zul
  run_name: mamba-125m-ner-lora-finetune-zul
  gradient_accumulation_steps: 4
  per_device_train_batch_size: 32
  gradient_checkpointing: true
  metric_for_best_model: eval_all_f1
  greater_is_better: true
