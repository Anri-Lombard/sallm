defaults:
  - defaults/datasets/sa_general@_here_
  - defaults/common@_here_
  - defaults/arch/xlstm@_here_
  - _self_
wandb:
  name: xlstm-125m-sa-general-all
model:
  init_checkpoint: anrilombard/sallm-xlstm-125m-native-3epoch-20260531
peft:
  kwargs:
    r: 128
    lora_alpha: 256
    lora_dropout: 0.05
    target_modules:
      - q
      - k
      - v
      - out_proj
dataset:
  subset: null
  max_seq_length: 1024
  languages: null
  mix_epoch_size: sum
  mix_max_prob: 0.35
  mix_min_prob: 0.05
  mix_temperature: 0.0
  mix_weights:
    afrihg: 1.0
    ner: 1.0
    news: 1.0
    pos: 1.0
    sib: 1.0
    t2x: 1.0
training:
  output_dir: ${oc.env:SCRATCH}/masters/sallm/checkpoints/ft_xlstm_125m_sa_general_all_targetsafe
  logging_dir: ${oc.env:SCRATCH}/masters/sallm/logs/ft_xlstm_125m_sa_general_all_targetsafe
  run_name: xlstm-125m-sa-general-all-targetsafe
  gradient_accumulation_steps: 16
  per_device_train_batch_size: 8
  num_train_epochs: 3
  save_strategy: epoch
  save_total_limit: 1
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  pad_to_multiple_of: 64
hub:
  base_model_id: anrilombard/sallm-xlstm-125m-native-3epoch-20260531
