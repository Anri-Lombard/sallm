defaults:
  - defaults/datasets/sa_general@_here_
  - defaults/common@_here_
  - defaults/arch/mamba2@_here_
  - _self_
wandb:
  name: mamba-125m-sa-general-all
peft:
  kwargs:
    lora_dropout: 0.05
dataset:
  subset: null
  max_seq_length: 1024
  languages: null
  mix_epoch_size: sum
  mix_max_prob: 0.35
  mix_min_prob: 0.05
  mix_temperature: 0.0
  mix_weights:
    afrihg: 1.0
    ner: 1.0
    news: 1.0
    pos: 1.0
    sib: 1.0
    t2x: 1.0
training:
  output_dir: ${oc.env:SCRATCH}/masters/sallm/checkpoints/ft_mamba_125m_sa_general_all
  logging_dir: ${oc.env:SCRATCH}/masters/sallm/logs/ft_mamba_125m_sa_general_all
  run_name: mamba-125m-sa-general-all
  gradient_accumulation_steps: 4
  per_device_train_batch_size: 4
  num_train_epochs: 1
  gradient_checkpointing: false
  metric_for_best_model: eval_loss
  greater_is_better: false
