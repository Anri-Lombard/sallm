defaults:
  - defaults/datasets/sib@_here_
  - defaults/common@_here_
  - defaults/arch/mamba2@_here_
  - _self_
wandb:
  name: mamba-125m-sib-xho
dataset:
  subset: xho_Latn
  max_seq_length: 2048
training:
  output_dir: ${oc.env:SCRATCH}/masters/sallm/checkpoints/ft_mamba_125m_sib_xho
  logging_dir: ${oc.env:SCRATCH}/masters/sallm/logs/ft_mamba_125m_sib_xho
  run_name: mamba-125m-sib-lora-xho
  gradient_accumulation_steps: 2
  per_device_train_batch_size: 32
  gradient_checkpointing: true
  metric_for_best_model: eval_classification/all_f1
  greater_is_better: true
