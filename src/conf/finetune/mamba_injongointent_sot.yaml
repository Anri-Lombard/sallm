defaults:
  - defaults/datasets/injongointent@_here_
  - defaults/common@_here_
  - defaults/arch/mamba2@_here_
  - _self_
wandb:
  name: mamba-125m-injongo-intent-sot
dataset:
  subset: sot
  max_seq_length: 2048
training:
  output_dir: ${oc.env:SCRATCH}/masters/sallm/checkpoints/ft_mamba_125m_injongointent_sot
  logging_dir: ${oc.env:SCRATCH}/masters/sallm/logs/ft_mamba_125m_injongointent_sot
  run_name: mamba-125m-injongo-intent-sot
  num_train_epochs: 20
  gradient_checkpointing: false
  metric_for_best_model: eval_classification/all_f1
  greater_is_better: true
