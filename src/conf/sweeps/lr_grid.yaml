name: hpo-lr-grid
project: sallm-ft
# The paper's learning-rate sweep: each task picks the best (lr, epoch) on validation.
method: grid
metric:
  name: eval/all_chrf
  goal: maximize
parameters:
  training.learning_rate:
    values:
      - 3.0e-05
      - 1.0e-04
      - 3.0e-04
command:
  - ${env}
  - python
  - -u
  - -m
  - sallm.hpo.run
  - --base-config
  - finetune/run
  - --override
  - finetune/defaults/arch@_global_=llama
  - --override
  - finetune/defaults/datasets@_global_=t2x
  - --override
  - dataset.subset=xho
