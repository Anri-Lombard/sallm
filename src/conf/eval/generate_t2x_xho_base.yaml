# @package _global_
defaults:
  - run@_here_
  - _self_
evaluation:
  generation_tasks:
    - dataset:
        assistant_only_loss: true
        hf_name: github:francois-meyer/t2x
        max_seq_length: 1024
        packing: false
        splits:
          test: test
          train: train
          val: validation
        subset: xho
        task: INSTRUCTION
        template_choice: ALL
        templates:
          - id: t2x_verbalisation/v1
            weight: 1
      decoding:
        no_repeat_ngram_size: 3
        num_beams: 5
        repetition_penalty: 1.2
        strategy: beam
      id: t2x_xho
      max_new_tokens: 256
      max_samples_per_lang: null
      split: test
