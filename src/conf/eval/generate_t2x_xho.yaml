# @package _global_
defaults:
  - run@_here_
  - _self_
evaluation:
  generation_tasks:
    - dataset:
        assistant_only_loss: true
        hf_name: github:francois-meyer/t2x
        max_seq_length: 1024
        packing: false
        splits:
          test: test
          train: train
          val: validation
        subset: xho
        task: INSTRUCTION
        template_choice: ALL
        templates:
          - id: t2x_verbalisation/v1
            weight: 1
      decoding:
        early_stopping: true
        length_penalty: 1.0
        num_beams: 5
        strategy: beam
      fewshot: 0
      fewshot_lang_match: true
      fewshot_seed: 42
      fewshot_split: train
      fewshot_template_mode: SAME
      fewshot_token_budget: 1792
      id: t2x_xho
      max_new_tokens: 512
      max_samples_per_lang: null
      prompt_headroom_tokens: 256
      split: test
      system_prompt: You are a helpful assistant that verbalises knowledge graph triples as fluent isiXhosa
        sentences.
