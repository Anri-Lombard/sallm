defaults:
  - defaults/run@_here_
  - _self_
eval_model:
  checkpoint: anrilombard/sallm-xlstm-125m
evaluation:
  generation_tasks:
    - dataset:
        assistant_only_loss: true
        hf_name: github:dadelani/AfriHG
        max_seq_length: 2048
        packing: false
        splits:
          test: test
          train: train
          val: validation
        subset: eng
        task: INSTRUCTION
        template_choice: ALL
        templates:
          - id: afrihg_headline/v1
            weight: 1
      decoding:
        strategy: greedy
      id: afrihg_eng
      max_new_tokens: 128
      max_samples_per_lang: null
      split: test
  output_dir: ${oc.env:SCRATCH}/masters/sallm/results/eval/xlstm_125m_afrihg_eng
wandb:
  name: eval-xlstm-125m-afrihg-eng
